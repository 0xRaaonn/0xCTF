# PHP Configuration File
# Main php.ini configuration

[PHP]
; Basic Settings
max_execution_time = 30
max_input_time = 60
memory_limit = 128M
post_max_size = 8M
upload_max_filesize = 2M

; Error handling
display_errors = Off
log_errors = On
error_log = /var/log/php/error.log

; Session handling
session.save_handler = files
session.save_path = "/tmp"

; File uploads
file_uploads = On
upload_tmp_dir = /tmp

; Security
allow_url_fopen = On
allow_url_include = Off 